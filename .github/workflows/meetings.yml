# Copies the next few meetings from the club's Google Calendar into data/meetings.json every hour,
# for the "Next meeting" block on the home page. See tools/build-meetings.py.
name: Meetings

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/build-meetings.py"
      - ".github/workflows/meetings.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: meetings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the calendar
        run: |
          pip install -q icalendar recurring_ical_events
          python3 tools/build-meetings.py

      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/meetings.json
          if git diff --cached --quiet; then echo "No calendar changes"; exit 0; fi
          git commit -q -m "Update upcoming meetings"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages will rebuild on the next push"
