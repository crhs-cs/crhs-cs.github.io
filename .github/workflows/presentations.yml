# Rebuilds the presentations list and first-slide thumbnails whenever slides are added,
# replaced or deleted in presentations/slides/. See tools/build-presentations.py.
name: Presentations

on:
  push:
    branches: [main]
    paths:
      - "presentations/slides/**"
      - "tools/build-presentations.py"
      - ".github/workflows/presentations.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: presentations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          if find presentations/slides -iname '*.ppt*' 2>/dev/null | grep -q .; then
            sudo apt-get install -y -qq --no-install-recommends libreoffice-impress \
              fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu
          fi

      - name: Build list and thumbnails
        run: python3 tools/build-presentations.py

      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data/presentations.json presentations/thumbs
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -q -m "Update presentations list and thumbnails"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # Pushes made by an Action don't always start a Pages rebuild, so ask for one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages will rebuild on the next push"
